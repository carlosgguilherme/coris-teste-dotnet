services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: coris_seguros
      MYSQL_USER: coris
      MYSQL_PASSWORD: coris123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: on-failure
    environment:
      ConnectionStrings__Padrao: "Server=mysql;Port=3306;Database=coris_seguros;User=coris;Password=coris123"
      TZ: America/Sao_Paulo
    ports:
      - "8000:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql-data:
